{% extends "base.html" %}

{% block header_title %}Stock Management{% endblock %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50">
        <div class="relative w-64">
            <input type="text" placeholder="Search inventory..."
                class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
            <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
        </div>
        <button
            class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            Add Item
        </button>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider border-b border-gray-100">
                    <th class="p-4 font-medium">Item Name</th>
                    <th class="p-4 font-medium">Current Stock</th>
                    <th class="p-4 font-medium">ROP</th>
                    <th class="p-4 font-medium">ROQ</th>
                    <th class="p-4 font-medium">Status</th>
                    <th class="p-4 font-medium">Actions</th>
                </tr>
            </thead>
            <tbody class="text-sm divide-y divide-gray-100">
                <!-- Mock Row 1 -->
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="p-4 font-medium text-gray-800">Steel Pipes 20mm</td>
                    <td class="p-4 text-gray-600">45</td>
                    <td class="p-4 text-gray-600">50</td>
                    <td class="p-4 text-gray-600">100</td>
                    <td class="p-4">
                        <span
                            class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-orange-100 text-orange-800">
                            Low Stock
                        </span>
                    </td>
                    <td class="p-4">
                        <button class="text-blue-600 hover:text-blue-800 font-medium">Reorder</button>
                    </td>
                </tr>
                <!-- Mock Row 2 -->
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="p-4 font-medium text-gray-800">Plastic Wrapping Roll</td>
                    <td class="p-4 text-gray-600">320</td>
                    <td class="p-4 text-gray-600">100</td>
                    <td class="p-4 text-gray-600">150</td>
                    <td class="p-4">
                        <span
                            class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                            Safe
                        </span>
                    </td>
                    <td class="p-4">
                        <button class="text-blue-600 hover:text-blue-800 font-medium">Edit</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="p-4 border-t border-gray-100 flex items-center justify-between text-sm text-gray-500">
        <span>Showing 1 to 10 of 1,248 entries</span>
        <div class="flex gap-2">
            <button
                class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 disabled:opacity-50">Previous</button>
            <button class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50">Next</button>
        </div>
    </div>
</div>
{% endblock %}
